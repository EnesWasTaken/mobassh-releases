<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="MobaSSH: a modern SSH, SFTP and terminal client for Windows">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8ff"/></linearGradient>
  <radialGradient id="gl" cx=".08" cy=".2" r=".5"><stop offset="0" stop-color="#3d8bfd" stop-opacity=".14"/><stop offset="1" stop-color="#3d8bfd" stop-opacity="0"/></radialGradient>
  <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5aa2ff"/><stop offset="1" stop-color="#1f5fe0"/></linearGradient>
  <linearGradient id="bt" x1="0" x2="1"><stop offset="0" stop-color="#3d8bfd"/><stop offset="1" stop-color="#6d6af8"/></linearGradient>
  <clipPath id="clip"><rect width="1000" height="200" rx="16"/></clipPath>
  <filter id="is" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f5fe0" flood-opacity=".45"/></filter>
</defs>
<style>.sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}.mono{font-family:'Cascadia Code','JetBrains Mono',Consolas,'SFMono-Regular',Menlo,monospace}</style>
<g clip-path="url(#clip)"><rect width="1000" height="200" fill="url(#bg)"/><rect width="1000" height="200" fill="url(#gl)"/></g>
<rect x=".5" y=".5" width="999" height="199" rx="16" fill="none" stroke="#0f172a" stroke-opacity=".12"/>

<g filter="url(#is)"><rect x="40" y="40" width="88" height="88" rx="22" fill="url(#ic)"/></g>
<rect x="40.5" y="40.5" width="87" height="87" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity=".25"/>
<path d="M63 66l19 18-19 18" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="88" y="97" width="24" height="8" rx="4" fill="#fff"/>

<text x="150" y="74" class="sans" font-size="30" font-weight="800" letter-spacing="-.6" fill="#0f172a">MobaSSH</text>
<g><rect x="312" y="52" width="121" height="24" rx="12.0" fill="#3d8bfd1a" stroke="#3d8bfd59"/><text x="372.5" y="68.3" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#1d5fd6">Windows 10 / 11</text>
  <rect x="441" y="52" width="48" height="24" rx="12.0" fill="#3d8bfd1a" stroke="#3d8bfd59"/><text x="465" y="68.3" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#1d5fd6">Free</text></g>
<text x="152" y="112" class="sans" font-size="16" fill="#475569">A modern SSH, SFTP and terminal client for Windows.</text>
<g><rect x="152" y="138" width="96" height="28" rx="14.0" fill="#f8fafc" stroke="#d0d7e2"/><text x="200.0" y="156.5" text-anchor="middle" class="sans" font-size="12.5" font-weight="600" fill="#334155">SSH &amp; SFTP</text>
  <rect x="256" y="138" width="110" height="28" rx="14.0" fill="#f8fafc" stroke="#d0d7e2"/><text x="311.0" y="156.5" text-anchor="middle" class="sans" font-size="12.5" font-weight="600" fill="#334155">Fast uploads</text>
  <rect x="374" y="138" width="131" height="28" rx="14.0" fill="#f8fafc" stroke="#d0d7e2"/><text x="439.5" y="156.5" text-anchor="middle" class="sans" font-size="12.5" font-weight="600" fill="#334155">Split terminals</text>
  <rect x="513" y="138" width="103" height="28" rx="14.0" fill="#f8fafc" stroke="#d0d7e2"/><text x="564.5" y="156.5" text-anchor="middle" class="sans" font-size="12.5" font-weight="600" fill="#334155">Code editor</text>
  <rect x="624" y="138" width="110" height="28" rx="14.0" fill="#f8fafc" stroke="#d0d7e2"/><text x="679.0" y="156.5" text-anchor="middle" class="sans" font-size="12.5" font-weight="600" fill="#334155">AI assistant</text>
  <rect x="742" y="138" width="68" height="28" rx="14.0" fill="#f8fafc" stroke="#d0d7e2"/><text x="776.0" y="156.5" text-anchor="middle" class="sans" font-size="12.5" font-weight="600" fill="#334155">Themes</text>
  <rect x="818" y="138" width="103" height="28" rx="14.0" fill="#f8fafc" stroke="#d0d7e2"/><text x="869.5" y="156.5" text-anchor="middle" class="sans" font-size="12.5" font-weight="600" fill="#334155">Auto-update</text></g>

<rect x="818" y="44" width="142" height="40" rx="11" fill="url(#bt)"/>
<text x="889" y="69" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#fff">Download &#8595;</text>
